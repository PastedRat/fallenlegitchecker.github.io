<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fallen Survival Legit Check</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --card: #171a21;
      --accent: #63d2ff;
      --text: #e9f1ff;
      --muted: #9aaccc;
      --bad: #ff5f6d;
      --ok: #6dff8a;
      --warn: #ffd86d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at 20% -10%, #1f3555 0, var(--bg) 40%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    .card {
      width: min(900px, 100%);
      background: linear-gradient(180deg, #1a1f29 0%, var(--card) 100%);
      border: 1px solid #2b3342;
      border-radius: 18px;
      padding: 1.25rem;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    h1 {
      margin: 0 0 .25rem;
      font-size: clamp(1.4rem, 2.2vw, 2rem);
    }

    .sub { color: var(--muted); margin: 0 0 1rem; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: .9rem;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: .35rem;
      font-size: .92rem;
      color: var(--muted);
    }

    input, select {
      border: 1px solid #34425a;
      background: #10141d;
      color: var(--text);
      padding: .62rem .7rem;
      border-radius: 10px;
      font-size: .95rem;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--accent); }

    .row {
      display: flex;
      align-items: end;
      gap: .8rem;
      flex-wrap: wrap;
      margin-top: .75rem;
    }

    button {
      border: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, #39bbff, #8f7eff);
      color: #05111e;
      font-weight: 800;
      padding: .72rem 1rem;
      cursor: pointer;
    }

    .switch {
      display: flex;
      align-items: center;
      gap: .5rem;
      color: var(--text);
      user-select: none;
    }

    .out {
      margin-top: 1rem;
      padding: .9rem;
      border-radius: 12px;
      border: 1px solid #354056;
      background: #0f141d;
    }

    .score {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 0 0 .4rem;
    }

    ul { margin: .4rem 0 0 1.2rem; }
    li { margin: .18rem 0; color: var(--muted); }
    .hint { color: var(--muted); font-size: .84rem; margin-top: .7rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Fallen Survival Legit Check</h1>
    <p class="sub">Type player info and run an ultra legit calculation with extra suspicious checks.</p>

    <form id="checker">
      <div class="grid">
        <label>
          Username
          <input id="username" required placeholder="e.g. KingRider3756" />
        </label>

        <label>
          Server
          <input id="server" placeholder="e.g. 2x #5" />
        </label>

        <label>
          Account age (years)
          <input id="years" type="number" min="0" value="0" />
        </label>

        <label>
          Account age (months)
          <input id="months" type="number" min="0" value="0" />
        </label>

        <label>
          Account age (days)
          <input id="days" type="number" min="0" value="0" />
        </label>

        <label>
          Hours played (optional)
          <input id="hours" type="number" min="0" placeholder="optional" />
        </label>

        <label>
          Kills (optional)
          <input id="kills" type="number" min="0" placeholder="optional" />
        </label>

        <label>
          Deaths (optional)
          <input id="deaths" type="number" min="0" placeholder="optional" />
        </label>

        <label>
          Friends count (optional)
          <input id="friends" type="number" min="0" placeholder="optional" />
        </label>

        <label>
          Triple headshots seen (optional)
          <input id="triples" type="number" min="0" placeholder="optional" />
        </label>

        <label>
          Reports against player (optional)
          <input id="reports" type="number" min="0" placeholder="optional" />
        </label>

        <label>
          Accusation posts / clips seen (optional)
          <input id="accusations" type="number" min="0" placeholder="optional" />
        </label>
      </div>

      <div class="row">
        <label class="switch">
          <input id="vip" type="checkbox" />
          Has VIP
        </label>
        <label class="switch">
          <input id="flying" type="checkbox" />
          Ever seen flying / impossible movement
        </label>
        <label class="switch">
          <input id="accused" type="checkbox" />
          Was accused by many players
        </label>
        <button type="submit">Check legit %</button>
      </div>
    </form>

    <section id="result" class="out" aria-live="polite">
      <p class="score">Legit score: --</p>
      <strong>Breakdown:</strong>
      <ul id="breakdown"><li>Waiting for input...</li></ul>
      <p class="hint">Score is clamped between 0% and 100%.</p>
    </section>
  </main>

  <script>
    const form = document.getElementById('checker');
    const scoreEl = document.querySelector('.score');
    const breakdownEl = document.getElementById('breakdown');

    const num = (id) => {
      const val = document.getElementById(id).value;
      return val === '' ? null : Number(val);
    };

    const addNote = (list, text) => {
      const li = document.createElement('li');
      li.textContent = text;
      list.appendChild(li);
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      let score = 100;
      const username = document.getElementById('username').value.trim();
      const server = document.getElementById('server').value.trim().toLowerCase();
      const vip = document.getElementById('vip').checked;
      const flying = document.getElementById('flying').checked;
      const accused = document.getElementById('accused').checked;

      const years = num('years') ?? 0;
      const months = num('months') ?? 0;
      const days = num('days') ?? 0;
      const totalDays = years * 365 + months * 30 + days;

      const hours = num('hours');
      const kills = num('kills');
      const deaths = num('deaths');
      const friends = num('friends');
      const triples = num('triples');
      const reports = num('reports');
      const accusations = num('accusations');

      breakdownEl.innerHTML = '';

      if (username.toLowerCase().includes('fallen')) {
        score -= 50;
        addNote(breakdownEl, 'Username contains "fallen": -50% legit');
      }

      if (/^([A-Z][a-z]+){2}\d{4}$/.test(username)) {
        score -= 30;
        addNote(breakdownEl, 'Looks like 2 capitalized words + 4 digits: -30% legit');
      }

      if (/[0-9]{6,}/.test(username)) {
        score -= 10;
        addNote(breakdownEl, 'Long number spam in username: -10% legit');
      }

      if (vip) {
        score += 25;
        addNote(breakdownEl, 'VIP detected: +25% legit');
      }

      if (server === '2x #5') {
        score -= 25;
        addNote(breakdownEl, 'Server is exactly "2x #5": -25% legit');
      }

      if (server.includes('2x') && server.includes('#')) {
        score -= 5;
        addNote(breakdownEl, 'Competitive multiplier server pattern: -5% legit');
      }

      if (totalDays < 30) {
        score -= 20;
        addNote(breakdownEl, 'Account younger than 1 month: -20% legit');
      } else if (totalDays < 180) {
        score -= 10;
        addNote(breakdownEl, 'Account younger than 6 months: -10% legit');
      }

      if (hours !== null && kills !== null && deaths !== null && hours > 0) {
        const kd = deaths === 0 ? kills : kills / deaths;
        if (hours < 50 && kd > 5) {
          score -= 10;
          addNote(breakdownEl, 'Very high K/D with low hours: -10% legit');
        }
        if (hours < 25 && kd > 8) {
          score -= 20;
          addNote(breakdownEl, 'Extreme K/D with very low hours: -20% legit');
        }
      }

      if (hours !== null && kills !== null && hours > 0) {
        const killsPerHour = kills / hours;
        if (hours < 30 && killsPerHour > 10) {
          score -= 15;
          addNote(breakdownEl, 'Too many kills per hour for low-time account: -15% legit');
        }
      }

      if (friends !== null) {
        if (friends < 3) {
          score -= 5;
          addNote(breakdownEl, 'Very low friends count: -5% legit');
        } else if (friends > 40) {
          score += 5;
          addNote(breakdownEl, 'Healthy friends count: +5% legit');
        }
      }

      if (flying) {
        score -= 45;
        addNote(breakdownEl, 'Seen flying/impossible movement: -45% legit');
      }

      if (triples !== null) {
        if (triples >= 3 && (hours ?? 0) < 30) {
          score -= 20;
          addNote(breakdownEl, 'Many triple headshots with low hours: -20% legit');
        } else if (triples >= 10) {
          score -= 15;
          addNote(breakdownEl, 'Very high triple headshot count: -15% legit');
        }
      }

      if (reports !== null) {
        if (reports >= 10) {
          score -= 20;
          addNote(breakdownEl, 'Lots of player reports: -20% legit');
        } else if (reports >= 5) {
          score -= 10;
          addNote(breakdownEl, 'Several player reports: -10% legit');
        }
      }

      if (accused) {
        score -= 15;
        addNote(breakdownEl, 'Widely accused by players: -15% legit');
      }

      if (accusations !== null) {
        if (accusations >= 8) {
          score -= 20;
          addNote(breakdownEl, 'Many accusation clips/posts found: -20% legit');
        } else if (accusations >= 3) {
          score -= 10;
          addNote(breakdownEl, 'Some accusation clips/posts found: -10% legit');
        }
      }

      if (hours !== null && triples !== null) {
        if (hours >= 700 && triples <= 30) {
          score += 5;
          addNote(breakdownEl, '700+ hours with controlled triple count: +5% legit');
        }
      }

      score = Math.max(0, Math.min(100, Math.round(score)));

      if (!breakdownEl.children.length) {
        addNote(breakdownEl, 'No rule triggered. Base score kept.');
      }

      let tag = 'Mixed';
      if (score >= 75) tag = 'Likely legit';
      else if (score <= 35) tag = 'Suspicious';

      scoreEl.textContent = `Legit score: ${score}% (${tag})`;
    });
  </script>
</body>
</html>
